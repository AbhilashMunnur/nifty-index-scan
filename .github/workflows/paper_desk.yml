name: Master paper desks

# Entry and exit must not wait for the 15-minute OI scan.
# The job starts two minutes early, then the script waits until the print.
# 14:05 IST is the entry open. 15:00 IST is the exit open.
# The regular scan still runs the desks first as a backup, at the same opens.
on:
  schedule:
    # 14:03 IST (08:33 UTC), weekdays. Script sleeps until 14:05:00.
    - cron: "33 8 * * 1-5"
    # 14:58 IST (09:28 UTC), weekdays. Script sleeps until 15:00:00.
    - cron: "28 9 * * 1-5"
  workflow_dispatch:

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: master-paper-desk
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      TZ: Asia/Kolkata
      ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
      ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
      ANGEL_PIN: ${{ secrets.ANGEL_PIN }}
      ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run paper desks
        id: paper
        timeout-minutes: 8
        run: python -u scripts/run_paper_desks.py

      - name: Save paper books
        id: save
        if: always()
        run: |
          mkdir -p /tmp/kept-data data
          cp -a data/. /tmp/kept-data/
          git reset --hard
          git clean -fd
          git fetch origin main
          git checkout -B main origin/main
          git reset --hard origin/main
          python3 scripts/keep_ledger.py /tmp/kept-data data
          git add data
          if git diff --cached --quiet; then
            echo "Ledger unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Nifty/Sensex paper books"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git reset --hard origin/main
            python3 scripts/keep_ledger.py /tmp/kept-data data
            git add data
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Update Nifty/Sensex paper books"
          done
          echo "Could not push the ledger after 3 attempts."
          exit 1

      - name: Publish public desk
        if: steps.paper.outcome == 'success' && steps.save.outcome == 'success'
        env:
          DESK_DEPLOY_KEY: ${{ secrets.DESK_DEPLOY_KEY }}
        run: python scripts/publish_desk.py --push
