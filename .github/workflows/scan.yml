name: Nifty 1H RSI + OI scan

# Repo 1 (nifty-index-trade) scans every slot while Actions accepts its jobs.
# Repo 2 (nifty-index-scan) scans the same slot only after GitHub refuses repo 1
# (monthly minutes used up, or the spending limit).
# Every weekday: 09:30–15:30 IST every 15 min, plus 15:40.
# Tuesday and Thursday also run 15:10.
# Each Telegram includes a P&L snapshot.
on:
  schedule:
    # Weekdays 09:30–15:15 IST (04:00–09:45 UTC). 09:45 UTC is 15:15 IST.
    - cron: "0,15,30,45 4-9 * * 1-5"
    # Tue/Thu 15:10 IST (09:40 UTC)
    - cron: "40 9 * * 2,4"
    # 15:30 IST (10:00 UTC) every weekday
    - cron: "0 10 * * 1-5"
    # 15:40 IST (10:10 UTC) close every weekday
    - cron: "10 10 * * 1-5"
    # One late kick if GitHub skips 09:30 IST (04:02 UTC)
    - cron: "2 4 * * 1-5"
  workflow_dispatch:
  repository_dispatch:
    types: [nifty-scan]

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: nifty-1h-scan
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      TZ: Asia/Kolkata
      ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
      ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
      ANGEL_PIN: ${{ secrets.ANGEL_PIN }}
      ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Repo 2 stands down while repo 1 can scan
        id: twin
        env:
          GH_TOKEN: ${{ secrets.TWIN_TOKEN }}
        run: python3 scripts/twin_host.py --workflow scan.yml

      - name: Slot guard
        id: slot
        if: steps.twin.outputs.scan == 'true'
        run: |
          python3 - <<'PY'
          import os
          from src.scan_slots import should_run_slot

          event = os.environ.get("GITHUB_EVENT_NAME", "")
          force = event == "workflow_dispatch"
          run, reason, slot = should_run_slot(force=force)
          print(reason)
          if slot is not None:
              print(f"slot={slot.isoformat()}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"run={'true' if run else 'false'}\n")
          PY

      - uses: actions/setup-python@v5
        if: steps.slot.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.slot.outputs.run == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-dejavu-core
          pip install -r requirements.txt

      - name: Cache key for today
        if: steps.slot.outputs.run == 'true'
        id: today
        run: echo "date=$(date +%F)" >> "$GITHUB_OUTPUT"

      - name: Restore market data cache
        if: steps.slot.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: .cache
          key: nifty-market-${{ steps.today.outputs.date }}
          restore-keys: |
            nifty-market-

      - name: Run scan
        id: scan
        if: steps.slot.outputs.run == 'true'
        timeout-minutes: 10
        run: python -u main.py --once --slot-guard

      - name: Save paper book and slot marker
        id: save
        if: always() && steps.slot.outputs.run == 'true'
        run: |
          mkdir -p /tmp/kept-data data
          cp -a data/. /tmp/kept-data/
          git reset --hard
          git clean -fd
          git fetch origin main
          git checkout -B main origin/main
          git reset --hard origin/main
          python3 scripts/keep_ledger.py /tmp/kept-data data
          git add data
          if git diff --cached --quiet; then
            echo "Ledger unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Nifty/Sensex paper books"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git reset --hard origin/main
            python3 scripts/keep_ledger.py /tmp/kept-data data
            git add data
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Update Nifty/Sensex paper books"
          done
          echo "Could not push the ledger after 3 attempts."
          exit 1

      - name: Publish public desk
        if: steps.slot.outputs.run == 'true' && steps.scan.outcome == 'success' && steps.save.outcome == 'success'
        env:
          DESK_DEPLOY_KEY: ${{ secrets.DESK_DEPLOY_KEY }}
        run: python scripts/publish_desk.py --push
