name: Publish public scan desk

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publish
        env:
          DESK_DEPLOY_KEY: ${{ secrets.DESK_DEPLOY_KEY }}
        run: python scripts/publish_desk.py --push

      - name: Remove scan days older than two days
        run: |
          if [ -z "$(git status --porcelain -- data/scan_history)" ]; then
            echo "No old scan days to remove."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/scan_history
          git commit -m "Drop scan days older than two days [skip ci]"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase --autostash origin HEAD || true
          done
          echo "Could not push the removed scan days."
          exit 1
